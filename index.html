<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitster">
<meta name="theme-color" content="#06141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<title>Hitster</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --ink:#06141c; --fg:#f4fbff; --muted:rgba(244,251,255,.72);
    --sea:#19b6d6; --sun:#e8ff3a; --glass:rgba(255,255,255,.12); --line:rgba(255,255,255,.22);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--fg);
    font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { overflow:hidden; }

  /* photo background, darkened toward the bottom where the controls sit */
  .bg { position:fixed; inset:0; background:url(photo.jpg) center 20%/cover no-repeat; transition:filter .6s, transform .6s; }
  .bg::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,20,28,.15) 0%, rgba(6,20,28,.35) 40%, rgba(6,20,28,.92) 72%, var(--ink) 100%); }
  body.dim .bg { filter:blur(22px) saturate(1.3); transform:scale(1.15); }
  body.dim .bg::after { background:rgba(6,20,28,.62); }

  .wrap { position:relative; height:100%; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px); }
  .screen { display:none; flex:1; flex-direction:column; align-items:center; gap:16px; text-align:center; }
  .screen.active { display:flex; animation:rise .45s cubic-bezier(.2,.8,.2,1); }
  .bottom { justify-content:flex-end; }
  .center { justify-content:center; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }

  h1 { margin:0; font-weight:800; font-size:clamp(54px,17vw,84px); line-height:.9; letter-spacing:-.04em;
    text-shadow:0 4px 30px rgba(0,0,0,.35); }
  h1 span { color:var(--sun); }
  h2 { margin:0; font-weight:800; font-size:32px; letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); line-height:1.4; max-width:340px; font-weight:500; }

  button { font:inherit; font-size:20px; font-weight:800; border:0; border-radius:999px; padding:18px 30px;
    background:var(--sun); color:var(--ink); width:100%; max-width:340px; cursor:pointer;
    box-shadow:0 10px 30px rgba(232,255,58,.25); transition:transform .12s; }
  button:active { transform:scale(.97); }
  button.ghost { background:var(--glass); color:var(--fg); box-shadow:none; border:1px solid var(--line);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  button.link { background:none; box-shadow:none; color:var(--muted); font-size:15px; font-weight:500;
    padding:6px; width:auto; text-decoration:underline; text-underline-offset:3px; }
  .row { display:flex; gap:12px; width:100%; max-width:340px; }
  .row button { flex:1; padding:16px 10px; font-size:18px; }

  input { font:inherit; font-size:16px; width:100%; max-width:340px; padding:14px 18px; border-radius:16px;
    border:1px solid var(--line); background:rgba(6,20,28,.6); color:var(--fg); }
  code { font-size:12px; background:rgba(6,20,28,.6); border:1px solid var(--line); padding:10px; border-radius:12px;
    word-break:break-all; display:block; max-width:340px; }
  .note { font-size:13px; }
  .ver { font-size:11px; opacity:.5; }

  #error { display:none; position:relative; z-index:2; background:rgba(120,20,30,.85); color:#ffe1e4;
    padding:12px 16px; border-radius:16px; text-align:center; font-weight:500; backdrop-filter:blur(10px); }

  /* scanner */
  .viewfinder { position:relative; width:100%; max-width:360px; aspect-ratio:1; border-radius:28px; overflow:hidden;
    background:#000; box-shadow:0 0 0 2px var(--sun), 0 20px 60px rgba(0,0,0,.5); }
  #reader { width:100%; height:100%; }
  #reader video { width:100% !important; height:100% !important; object-fit:cover; }
  #reader img, #reader__dashboard, #reader__header_message { display:none !important; }

  /* spinning record with the photo as label */
  .record { position:relative; width:min(72vw,300px); aspect-ratio:1; border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, #111 0 2px, #1c1c1c 2px 4px);
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 6px #0a0a0a;
    animation:spin 2.4s linear infinite; }
  .record::before { content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.12) 25%, transparent 32% 70%, rgba(255,255,255,.08) 75%, transparent 82%); }
  .record .label { position:absolute; inset:27%; border-radius:50%; background:url(label.jpg) center/cover;
    box-shadow:0 0 0 4px var(--sun); }
  .record .hole { position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--ink); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .paused .record { animation-play-state:paused; }
  .eq { display:flex; gap:5px; height:26px; align-items:flex-end; }
  .eq i { width:6px; background:var(--sun); border-radius:3px; animation:eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s} .eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq { 0%,100%{height:6px} 50%{height:26px} }
  .paused .eq i { animation:none; height:6px; }
  .spacer { flex:1; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div id="error"></div>

<!-- First start: enter Spotify client ID -->
<section class="screen bottom" id="s-setup">
  <h2>Setup</h2>
  <p>Spotify Client ID aus dem Developer Dashboard eintragen.</p>
  <input id="clientId" placeholder="Client ID" autocapitalize="off" autocorrect="off" spellcheck="false">
  <p class="note">Diese Redirect URI muss im Dashboard eingetragen sein:</p>
  <code id="redirectUri"></code>
  <button id="saveSetup">Speichern</button>
</section>

<!-- Login -->
<section class="screen bottom" id="s-login">
  <h1>Hit<span>ster</span></h1>
  <p>Mit Spotify (Premium) anmelden und loslegen.</p>
  <button id="loginBtn">Mit Spotify anmelden</button>
  <button class="link" id="resetBtn">Client ID ändern</button>
</section>

<!-- Ready to scan -->
<section class="screen bottom" id="s-home">
  <h1>Hit<span>ster</span></h1>
  <p>Spotify-App kurz öffnen, dann Karte scannen.</p>
  <button id="scanBtn">Karte scannen</button>
  <button class="link" id="logoutBtn">Abmelden</button>
  <p class="ver">v6</p>
</section>

<!-- Camera -->
<section class="screen center" id="s-scan">
  <h2>Karte scannen</h2>
  <div class="viewfinder"><div id="reader"></div></div>
  <p>QR-Code ins Feld halten</p>
  <button class="ghost" id="cancelScan">Abbrechen</button>
</section>

<!-- Playing -->
<section class="screen center" id="s-play">
  <div class="spacer"></div>
  <div class="record"><div class="label"></div></div>
  <div class="eq"><i></i><i></i><i></i><i></i></div>
  <h2 id="playState">Welches Jahr?</h2>
  <div class="spacer"></div>
  <div class="row">
    <button class="ghost" id="toggleBtn">Pause</button>
    <button id="nextBtn">Nächste</button>
  </div>
</section>
</div>

<script>
const SCOPES = "user-modify-playback-state user-read-playback-state";
const REDIRECT_URI = location.origin + location.pathname;
const API = "https://api.spotify.com/v1";
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};
const $ = id => document.getElementById(id);
let scanner = null, paused = false;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  document.body.classList.toggle("dim", id === "s-scan" || id === "s-play");
}
function showError(msg) {
  const e = $("error");
  e.textContent = msg;
  e.style.display = msg ? "block" : "none";
}

// ---------- Spotify auth (PKCE, no server needed) ----------
function randomString(len) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes, b => chars[b % chars.length]).join("");
}
async function sha256base64url(str) {
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function login() {
  const verifier = randomString(64);
  store.set("hs_verifier", verifier);
  const params = new URLSearchParams({
    response_type: "code",
    client_id: store.get("hs_client_id"),
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: await sha256base64url(verifier),
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}
function saveTokens(t) {
  store.set("hs_access", t.access_token);
  if (t.refresh_token) store.set("hs_refresh", t.refresh_token);
  store.set("hs_expires", String(Date.now() + (t.expires_in - 60) * 1000));
}
async function tokenRequest(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: store.get("hs_client_id"), ...body }),
  });
  if (!r.ok) throw new Error("Anmeldung fehlgeschlagen (" + r.status + ")");
  saveTokens(await r.json());
}
async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT_URI);
  if (q.has("error")) throw new Error("Spotify-Anmeldung abgebrochen");
  await tokenRequest({
    grant_type: "authorization_code",
    code: q.get("code"),
    redirect_uri: REDIRECT_URI,
    code_verifier: store.get("hs_verifier"),
  });
}
async function accessToken() {
  if (Date.now() > Number(store.get("hs_expires") || 0)) {
    await tokenRequest({ grant_type: "refresh_token", refresh_token: store.get("hs_refresh") });
  }
  return store.get("hs_access");
}
async function api(method, path, body, retry = true) {
  const r = await fetch(API + path, {
    method,
    headers: { Authorization: "Bearer " + await accessToken(), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && retry) {
    store.set("hs_expires", "0");
    return api(method, path, body, false);
  }
  return r;
}

// ---------- Playback ----------
const sleep = ms => new Promise(res => setTimeout(res, ms));
async function spotifyError(r) {
  try { const j = await r.json(); return (j.error && j.error.message) || ""; } catch { return ""; }
}
async function pickDevice() {
  const r = await api("GET", "/me/player/devices");
  if (!r.ok) throw new Error("Geräte konnten nicht geladen werden (" + r.status + ")");
  const devices = (await r.json()).devices || [];
  // Always prefer the phone, even if a PC/web player is currently active
  const phones = devices.filter(d => d.type === "Smartphone");
  return phones.find(d => d.is_active) || phones[0] || null;
}
async function playTrack(id) {
  const device = await pickDevice();
  if (!device) throw new Error("Spotify-App auf dem Handy nicht gefunden. Spotify-App auf dem Handy öffnen, kurz einen Song abspielen, dann zurück hierher und erneut scannen.");
  if (!device.is_active) {
    // Move playback to the phone first, then start the song
    await api("PUT", "/me/player", { device_ids: [device.id], play: false });
    await sleep(800);
  }
  // Look up the track: playable in this country? which album? (Spotify may
  // swap in a regional copy of the track, so use the uri it returns)
  let trackUri = "spotify:track:" + id, albumUri = null;
  const t = await api("GET", "/tracks/" + id + "?market=from_token");
  if (t.ok) {
    const j = await t.json();
    if (j.is_playable === false) throw new Error("Dieser Song ist in deinem Land bei Spotify nicht abspielbar.");
    trackUri = j.uri || trackUri;
    albumUri = j.album && j.album.uri;
  }

  // Start the album at this track (the method that works reliably on the phone);
  // fall back to queue + skip if Spotify does not start playing
  const methods = [];
  if (albumUri) methods.push(() =>
    api("PUT", "/me/player/play?device_id=" + device.id, { context_uri: albumUri, offset: { uri: trackUri } }));
  methods.push(async () => {
    const q = await api("POST", "/me/player/queue?device_id=" + device.id + "&uri=" + encodeURIComponent(trackUri));
    if (!q.ok) return q;
    await sleep(400);
    return api("POST", "/me/player/next?device_id=" + device.id);
  });
  let last = "";
  for (const send of methods) {
    const r = await send();
    if (r.status === 403) throw new Error("Spotify Premium wird benötigt. " + await spotifyError(r));
    if (!r.ok) { last = r.status + " " + await spotifyError(r); continue; }
    if (await waitForPlay(device.id, [id, trackUri.split(":").pop()], 4000) === true) return device.name;
    last = "Spotify spielt nicht";
  }
  throw new Error("Abspielen hat nicht geklappt (" + last + "). Spotify-App auf dem Handy öffnen und erneut scannen.");
}
async function waitForPlay(deviceId, ids, ms) {
  // Only counts if the card's song (not some earlier song) is playing on the phone
  const start = Date.now();
  let state = null;
  while (Date.now() - start < ms) {
    await sleep(500);
    state = await playerState();
    const item = state && state.item;
    const isCardSong = item && (ids.includes(item.id) || (item.linked_from && ids.includes(item.linked_from.id)));
    if (state && state.is_playing && state.device && state.device.id === deviceId && isCardSong) return true;
  }
  return state;
}
async function playerState() {
  const r = await api("GET", "/me/player");
  if (r.status !== 200) return null;
  try { return await r.json(); } catch { return null; }
}
async function togglePause() {
  showError("");
  const r = await api("PUT", paused ? "/me/player/play" : "/me/player/pause");
  if (!r.ok) { showError("Steuerung fehlgeschlagen (" + r.status + ")"); return; }
  paused = !paused;
  $("toggleBtn").textContent = paused ? "Weiter" : "Pause";
  $("playState").textContent = paused ? "Pausiert" : "Welches Jahr?";
  $("s-play").classList.toggle("paused", paused);
}

// ---------- QR parsing: Spotify links, URIs, #t=ID or bare ID ----------
function parseTrackId(text) {
  const m = text.match(/track[\/:]([A-Za-z0-9]{22})/)
         || text.match(/[#?&]t=([A-Za-z0-9]{22})/)
         || text.trim().match(/^([A-Za-z0-9]{22})$/);
  return m ? m[1] : null;
}

// ---------- Scanner ----------
async function startScan() {
  showError("");
  show("s-scan");
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScan,
      () => {}
    );
  } catch (e) {
    show("s-home");
    showError("Kamera nicht verfügbar. Kamerazugriff in den Einstellungen erlauben.");
  }
}
async function stopScan() {
  if (scanner) {
    try { await scanner.stop(); } catch {}
    scanner = null;
  }
}
let handling = false;
async function onScan(text) {
  if (handling) return;
  const id = parseTrackId(text);
  if (!id) { showError("Kein Spotify-Song in diesem QR-Code."); return; }
  handling = true;
  await stopScan();
  try {
    const deviceName = await playTrack(id);
    paused = false;
    $("toggleBtn").textContent = "Pause";
    $("playState").textContent = "Welches Jahr?";
    $("s-play").classList.remove("paused");
    showError("");
    show("s-play");
  } catch (e) {
    show("s-home");
    showError(e.message);
  } finally {
    handling = false;
  }
}

// ---------- Wiring ----------
$("redirectUri").textContent = REDIRECT_URI;
$("saveSetup").onclick = () => {
  const id = $("clientId").value.trim();
  if (!id) return;
  store.set("hs_client_id", id);
  show("s-login");
};
$("loginBtn").onclick = () => login();
$("resetBtn").onclick = () => { store.del("hs_client_id"); show("s-setup"); };
$("logoutBtn").onclick = () => {
  ["hs_access", "hs_refresh", "hs_expires"].forEach(store.del);
  show("s-login");
};
$("scanBtn").onclick = startScan;
$("cancelScan").onclick = async () => { await stopScan(); show("s-home"); };
$("nextBtn").onclick = startScan;
$("toggleBtn").onclick = togglePause;

(async function init() {
  if (!store.get("hs_client_id")) { show("s-setup"); return; }
  try { await handleRedirect(); } catch (e) { showError(e.message); }
  show(store.get("hs_refresh") ? "s-home" : "s-login");
})();
</script>
</body>
</html>
